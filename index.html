<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>마이마이 DX 베스트 50 분석기</title>
    <style>
        body { background-color: #121212; color: #ffffff; padding: 20px; }
        .loading { text-align: center; color: #00ffcc; font-size: 18px; }
        .error-box { background-color: #441111; border: 2px solid #ff4444; padding: 15px; display: none; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
    </style>
</head>
<body>
    <h1>마이마이 DX 베스트 50 요약기</h1>
    <div id="loading-text" class="loading">데이터 로딩 중...</div>
    <div id="error-log" class="error-box"></div>
    <div id="main-content" style="display:none;">
        <div class="summary-box">
            <h3 id="total-rating">0</h3>
        </div>
        <div id="new-songs-list" class="grid-container"></div>
        <div id="old-songs-list" class="grid-container"></div>
    </div>

<script>
async function init() {
    const savedData = localStorage.getItem('maimaiData');
    if (!savedData) {
        showError("수집된 데이터가 없습니다. 먼저 마이마이 사이트에서 북마크릿으로 수집을 진행해주세요.");
        return;
    }

    let userRecords;
    try {
        userRecords = JSON.parse(savedData);
    } catch (e) {
        showError("데이터 형식이 올바르지 않습니다.");
        return;
    }

    try {
        const response = await fetch('https://risher112.github.io/MaiRate/music_data.json');
        const localMultiMusicDB = await response.json();
        
        // 데이터 처리 로직 수행...
        // (이후 매칭 및 렌더링 로직은 기존 방식을 그대로 사용)
        processAndRender(userRecords, localMultiMusicDB);
    } catch (e) {
        showError("데이터베이스를 불러올 수 없습니다: " + e.message);
    }
}

function showError(msg) {
    document.getElementById('loading-text').style.display = 'none';
    const errLog = document.getElementById('error-log');
    errLog.style.display = 'block';
    errLog.innerText = msg;
}

// 이후 processAndRender 함수 및 나머지 렌더링 함수들을 배치
window.onload = init;
</script>
</body>
</html>
