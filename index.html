<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이마이 DX 일본판 베스트 50 레이팅 분석기</title>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: 'Arial', sans-serif; padding: 20px; }
        h1, h2 { text-align: center; color: #00ffcc; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; margin-bottom: 40px; }
        .song-card { background-color: #1e1e1e; border: 2px solid #333; border-radius: 10px; padding: 10px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .title { font-size: 12px; font-weight: bold; color: #00ffcc; margin-bottom: 5px; }
        .achieve { color: #ffcc00; font-weight: bold; font-size: 16px; }
        .rating { color: #aaaaaa; font-size: 13px; margin-top: 5px; }
        .error-box { background-color: #441111; border: 1px solid #ff4444; padding: 15px; border-radius: 5px; margin-bottom: 20px; }
    </style>
</head>
<body>
  
    <h1>마이마이 DX 베스트 50 요약기</h1>

    <!-- 에러가 나면 눈으로 볼 수 있게 만든 디버깅 박스 -->
    <div id="error-log" class="error-box" style="display:none;">
        <h3 style="color:#ff6666; margin-top:0;">⚠️ 시스템 내부 로그 (디버깅용)</h3>
        <p id="error-message" style="font-family:monospace; color:#eee;"></p>
    </div>
    
    <h2>신곡 상위 15곡 (New Songs Best 15)</h2>
    <div id="new-songs-list" class="grid-container"></div>
  
    <h2>구곡 상위 35곡 (Old Songs Best 35)</h2>
    <div id="old-songs-list" class="grid-container"></div>

    <hr style="border: 1px solid #333; margin: 40px 0;">

    <h2>⚠️ [검증용] 추출된 전체 곡 목록 (총 <span id="debug-count">0</span>개)</h2>
    <div id="unregistered-songs-list" class="grid-container"></div>
  
<script>
const musicConstantDB = {
    "超ナイト・オブ・ナイツ": { level: 11.0, isNew: true, image: "" },
    "Arrow": { level: 12.0, isNew: true, image: "" }
};

function showError(msg) {
    document.getElementById('error-log').style.display = 'block';
    document.getElementById('error-message').innerHTML += msg + "<br>";
}

function init() {
    try {
        const urlParams = new URLSearchParams(window.location.search);
        let rawData = urlParams.get('data');
      
        if (!rawData) {
            showError("주소창에서 'data' 파라미터를 읽지 못했습니다. 북마크릿 주소 연동을 확인해 주세요.");
            return;
        }

        let userRecords = [];
        try {
            // URL 디코딩 후 JSON 파싱 시도
            userRecords = JSON.parse(decodeURIComponent(rawData));
        } catch (jsonErr) {
            showError("1차 데이터 파싱 에러 발생. 깨진 문자열 복구를 시도합니다: " + jsonErr.message);
            
            // 특수문자 깨짐 강제 구제 로직
            try {
                let fixedData = decodeURIComponent(rawData.replace(/\+/g, '%20'));
                userRecords = JSON.parse(fixedData);
                showError("💡 데이터 복구에 성공했습니다! 정상적으로 곡을 불러옵니다.");
            } catch (retryErr) {
                showError("❌ 치명적인 데이터 깨짐 에러. 파싱 불가: " + retryErr.message);
                showError("현재 전달된 데이터 원문 맛보기: " + rawData.substring(0, 100));
                return;
            }
        }
        
        document.getElementById('debug-count').innerText = userRecords.length;
        
        let processedSongs = [];
        let unregisteredSongs = []; 
      
        userRecords.forEach(record => {
            if (!record || !record.title) return;
            
            const songInfo = musicConstantDB[record.title];
            if (songInfo) {
                processedSongs.push({
                    title: record.title,
                    achieve: record.achieve,
                    rating: Math.floor(songInfo.level * 22.4 * (Math.min(record.achieve, 100.5) / 100)),
                    isNew: songInfo.isNew || false
                });
            } else {
                unregisteredSongs.push({
                    title: record.title,
                    achieve: record.achieve,
                    rating: 0
                });
            }
        });
      
        processedSongs.sort((a, b) => b.rating - a.rating);
        
        renderSongs(processedSongs.filter(s => s.isNew).slice(0, 15), 'new-songs-list');
        renderSongs(processedSongs.filter(s => !s.isNew).slice(0, 35), 'old-songs-list');
        renderSongs(unregisteredSongs, 'unregistered-songs-list');

    } catch (globalErr) {
        showError("전체 시스템 에러 치명상: " + globalErr.message);
    }
}
  
function renderSongs(songs, targetId) {
    const container = document.getElementById(targetId);
    if (!container) return;
    
    if (songs.length === 0) {
        container.innerHTML = "<p style='color:#666; width:100%; text-align:center;'>표시할 곡이 없습니다.</p>";
        return;
    }
    
    songs.forEach(song => {
        const card = document.createElement('div');
        card.className = 'song-card';
        card.innerHTML = `
            <div class="title">${song.title}</div>
            <div class="achieve">${song.achieve.toFixed(4)}%</div>
            <div class="rating">Rating: <strong>${song.rating > 0 ? song.rating : 'DB미등록'}</strong></div>
        `;
        container.appendChild(card);
    });
}
  
window.onload = init;
</script>
</body>
</html>
