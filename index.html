<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이마이 DX 일본판 베스트 50 레이팅 분석기</title>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: 'Arial', sans-serif; padding: 20px; }
        h1, h2 { text-align: center; color: #00ffcc; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; margin-bottom: 40px; }
        .song-card { background-color: #1e1e1e; border: 2px solid #333; border-radius: 10px; padding: 10px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .song-card img { width: 100%; max-width: 120px; border-radius: 5px; margin-bottom: 8px; }
        .title { font-size: 14px; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 5px; color: #fff; }
        .achieve { color: #ffcc00; font-weight: bold; font-size: 16px; }
        .rating { color: #00ffcc; font-size: 13px; margin-top: 5px; }
        .warning-text { text-align: center; color: #ff9900; font-weight: bold; margin-bottom: 20px; }
    </style>
</head>
<body>
  
    <h1>마이마이 DX 베스트 50 요약기</h1>
    
    <h2>신곡 상위 15곡 (New Songs Best 15)</h2>
    <div id="new-songs-list" class="grid-container"></div>
  
    <h2>구곡 상위 35곡 (Old Songs Best 35)</h2>
    <div id="old-songs-list" class="grid-container"></div>

    <hr style="border: 1px solid #333; margin: 40px 0;">

    <h2>⚠️ [검증용] 마이마이넷에서 추출된 전체 곡 목록 (총 <span id="debug-count">0</span>개)</h2>
    <p class="warning-text">아래에 뜨는 곡 제목들을 복사해서 musicConstantDB에 등록하시면 위쪽 상위 곡 칸으로 올라갑니다!</p>
    <div id="unregistered-songs-list" class="grid-container"></div>
  
<script>
// 1. 보면 상수 데이터베이스 (테스트용)
const musicConstantDB = {
    "超ナイト・オブ・ナイツ": { level: 11.0, isNew: true, image: "https://maimai.sega.jp/storage/jacket/010101.png" },
    "Arrow": { level: 12.0, isNew: true, image: "https://maimai.sega.jp/storage/jacket/020202.png" }
};

// 2. 판정계수 계산
function getRatingCoefficient(achieve) {
    if (achieve >= 100.5000) return 22.4;
    if (achieve >= 100.0000) return 21.6;
    if (achieve >= 99.5000)  return 21.1;
    if (achieve >= 99.0000)  return 20.8;
    if (achieve >= 98.0000)  return 20.3;
    if (achieve >= 97.0000)  return 20.0;
    return 16.8;
}
  
// 3. 레이팅 계산
function calculateSingleRating(constant, achieve) {
    const coeff = getRatingCoefficient(achieve);
    const targetAchieve = Math.min(achieve, 100.5);
    return Math.floor(constant * coeff * (targetAchieve / 100));
}
  
// 4. 메인 로직
function init() {
    const urlParams = new URLSearchParams(window.location.search);
    const rawData = urlParams.get('data');
  
    if (!rawData) {
        document.body.innerHTML += "<p style='text-align:center; color:#ff4444;'>북마크릿을 통해 데이터를 전송받지 못했습니다.</p>";
        return;
    }
  
    const userRecords = JSON.parse(decodeURIComponent(rawData));
    
    // 가져온 데이터 개수 표시
    document.getElementById('debug-count').innerText = userRecords.length;
    
    let processedSongs = [];
    let unregisteredSongs = []; 
  
    userRecords.forEach(record => {
        const songInfo = musicConstantDB[record.title];
        
        if (songInfo) {
            const isSongNew = songInfo.isNew || songInfo.isnew || false;
            const rating = calculateSingleRating(songInfo.level, record.achieve);
            
            processedSongs.push({
                title: record.title,
                achieve: record.achieve,
                rating: rating,
                isNew: isSongNew,
                image: songInfo.image
            });
        } else {
            // DB에 없는 곡은 0점 처리하되, 이름과 달성률을 유지해서 보관
            unregisteredSongs.push({
                title: record.title,
                achieve: record.achieve,
                rating: 0,
                image: 'https://via.placeholder.com/120/222222/ffffff?text=No+Image'
            });
        }
    });
  
    // 정렬 및 필터링
    processedSongs.sort((a, b) => b.rating - a.rating);
    const newSongs = processedSongs.filter(s => s.isNew).slice(0, 15);
    const oldSongs = processedSongs.filter(s => !s.isNew).slice(0, 35);
  
    // 화면에 각각 출력
    renderSongs(newSongs, 'new-songs-list');
    renderSongs(oldSongs, 'old-songs-list');
    renderSongs(unregisteredSongs, 'unregistered-songs-list');
}
  
function renderSongs(songs, targetId) {
    const container = document.getElementById(targetId);
    if (!container) return;
    
    if (songs.length === 0) {
        container.innerHTML = "<p style='color:#666; width:100%; text-align:center;'>표시할 곡이 없습니다.</p>";
        return;
    }
    
    songs.forEach(song => {
        const card = document.createElement('div');
        card.className = 'song-card';
        card.innerHTML = `
            <img src="${song.image}" alt="${song.title}">
            <div class="title" style="font-size:12px; font-weight:bold; color:#00ffcc; margin-bottom:5px;">${song.title}</div>
            <div class="achieve">${song.achieve.toFixed(4)}%</div>
            <div class="rating">Rating: <strong>${song.rating > 0 ? song.rating : 'DB미등록'}</strong></div>
        `;
        container.appendChild(card);
    });
}
  
window.onload = init;
</script>
</body>
</html>
