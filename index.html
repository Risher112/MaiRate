<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이마이 DX 일본판 베스트 50 레이팅 분석기</title>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: 'Arial', sans-serif; padding: 20px; }
        h1, h2 { text-align: center; color: #00ffcc; }
        .summary-box { background-color: #1e1e1e; border: 2px solid #00ffcc; border-radius: 10px; padding: 15px; max-width: 500px; margin: 0 auto 30px auto; text-align: center; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-bottom: 40px; }
        .song-card { background-color: #1e1e1e; border: 2px solid #333; border-radius: 10px; padding: 12px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.3); position: relative; }
        .song-card.ap-border { border-color: #ffcc00; box-shadow: 0 0 10px #ffcc00; }
        .ap-badge { position: absolute; top: 5px; right: 5px; background-color: #ffcc00; color: #000; font-size: 10px; font-weight: bold; padding: 2px 5px; border-radius: 3px; }
        .title { font-size: 13px; font-weight: bold; color: #fff; margin-bottom: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .achieve { color: #ffcc00; font-weight: bold; font-size: 16px; margin: 5px 0; }
        .rating { color: #00ffcc; font-size: 14px; }
        .type-badge { display: inline-block; font-size: 10px; padding: 1px 4px; border-radius: 3px; margin-right: 4px; font-weight: bold; }
        .type-dx { background-color: #00cdff; color: #000; }
        .type-std { background-color: #ff5577; color: #fff; }
        .diff-badge { display: inline-block; padding: 2px 6px; font-size: 11px; font-weight: bold; border-radius: 3px; background-color: #333; margin-top: 3px; }
        .diff-master { background-color: #9933ff; color: #fff; }
        .diff-remaster { background-color: #e6007e; color: #fff; }
        .diff-expert { background-color: #ffaa00; color: #000; }
        .loading { text-align: center; font-size: 18px; color: #00ffcc; margin: 5px 0; }
        .error-box { background-color: #441111; border: 2px solid #ff4444; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: none; }
    </style>
</head>
<body>
  
    <h1>마이마이 DX 베스트 50 요약기</h1>

    <div id="loading-text" class="loading">네트워크 통신 및 데이터 매칭 엔진 구동 중...</div>

    <div id="error-log" class="error-box">
        <h3 style="color:#ff6666; margin-top:0; margin-bottom:5px;">⚠️ 시스템 진단 알림</h3>
        <p id="error-message" style="font-family:monospace; color:#eee; margin:0; line-height:1.5; white-space:pre-wrap;"></p>
    </div>

    <div id="main-content" style="display:none;">
        <div class="summary-box">
            <h3 style="margin:0; color:#aaa;">베스트 50 총합 레이팅</h3>
            <p style="font-size: 32px; font-weight: bold; color: #00ffcc; margin: 10px 0;" id="total-rating">0</p>
            <p style="margin:0; font-size:12px; color:#888;">(신곡 상위 15곡 + 구곡 상위 35곡 합산)</p>
        </div>
        
        <h2>신곡 상위 15곡 (New Songs Best 15)</h2>
        <div id="new-songs-list" class="grid-container"></div>
      
        <h2>구곡 상위 35곡 (Old Songs Best 35)</h2>
        <div id="old-songs-list" class="grid-container"></div>

        <hr style="border: 1px solid #333; margin: 40px 0;">

        <h2>⚠️ 데이터베이스 파일 연동 확인용 (전체 수집 목록)</h2>
        <div id="unregistered-songs-list" class="grid-container"></div>
    </div>
  
<script>
function getRankInfo(achieve) {
    if (achieve >= 100.5000) return { rank: "SSS+", coeff: 22.4 };
    if (achieve >= 100.0000) return { rank: "SSS", coeff: 21.6 };
    if (achieve >= 99.5000)  return { rank: "SS+", coeff: 21.1 };
    if (achieve >= 99.0000)  return { rank: "SS", coeff: 20.8 };
    if (achieve >= 98.0000)  return { rank: "S+", coeff: 20.3 };
    if (achieve >= 97.0000)  return { rank: "S", coeff: 20.0 };
    if (achieve >= 94.0000)  return { rank: "AAA", coeff: 16.8 };
    if (achieve >= 90.0000)  return { rank: "AA", coeff: 15.2 };
    if (achieve >= 80.0000)  return { rank: "A", coeff: 13.6 };
    return { rank: "D", coeff: 0.0 };
}
  
function calculateRating(constant, achieve, isAP) {
    const rankInfo = getRankInfo(achieve);
    const targetAchieve = Math.min(achieve, 100.5); 
    let baseRating = Math.floor(constant * (targetAchieve / 100) * rankInfo.coeff);
    if (isAP) baseRating += 1;
    return { rating: baseRating, rank: rankInfo.rank };
}

function normalizeTitle(str) {
    if (!str) return "";
    return str.toString()
              .toLowerCase()
              .replace(/[\s\t\n\r]/g, "")
              .replace(/[「」『』◆◇◇■□●○★☆,.\-_'"]/g, "");
}

async function init() {
    const urlParams = new URLSearchParams(window.location.search);
    const rawData = urlParams.get('data');
    if (!rawData) {
        showError("북마크릿 데이터가 정상적으로 전송되지 않았습니다.");
        return;
    }

    let userRecords = [];
    try {
        userRecords = JSON.parse(decodeURIComponent(rawData));
    } catch (e) {
        userRecords = JSON.parse(decodeURIComponent(rawData.replace(/\+/g, '%20')));
    }

    // 💡 변경점: 주소를 웹상의 절대 주소로 고정하고 원인을 파악할 수 있는 정밀 Catch 문을 장착했습니다.
    let localMultiMusicDB = [];
    const dbUrl = 'https://risher112.github.io/MaiRate/music_data.json';
    try {
        const response = await fetch(dbUrl);
        if (!response.ok) {
            throw new Error(`파일 주소는 맞으나 인터넷 연결 실패 (인터넷 에러 상태코드: ${response.status})`);
        }
        
        const jsonText = await response.text();
        try {
            localMultiMusicDB = JSON.parse(jsonText);
        } catch(jsonErr) {
            throw new Error(`[CRITICAL] music_data.json의 글자 문법이 깨져있습니다.\n쌍따옴표(") 누락이나 잘못된 쉼표(,)가 있는지 확인하세요.\n세부 에러내용: ${jsonErr.message}`);
        }
    } catch (e) {
        showError(`데이터베이스 로드 도중 치명적 에러 발생:\n${e.message}\n\n도움말: music_data.json 파일이 깃허브 저장소에 소문자로 정확히 생성되어 있는지, 문법이 유효한지 체크바랍니다.`);
        return;
    }

    let processedSongs = [];
    let unregisteredSongs = []; 

    userRecords.forEach(record => {
        const isAP = record.ap || false;
        
        const songData = localMultiMusicDB.find(m => {
            const cleanTarget = normalizeTitle(record.title);
            const cleanDB = normalizeTitle(m.title);
            const matchDiff = (m.difficulty || "").trim().toLowerCase() === (record.difficulty || "").trim().toLowerCase();
            const matchType = (m.type || "").trim().toUpperCase() === (record.type || "").trim().toUpperCase();
            return cleanTarget === cleanDB && matchDiff && matchType;
        });

        if (songData) {
            const levelConstant = parseFloat(songData.lev);
            if (!isNaN(levelConstant)) {
                const calc = calculateRating(levelConstant, record.achieve, isAP);
                processedSongs.push({
                    title: record.title,
                    type: record.type,
                    difficulty: record.difficulty,
                    achieve: record.achieve,
                    rating: calc.rating,
                    rank: calc.rank,
                    isNew: songData.is_new === true || songData.is_new === "true" || songData.is_new === 1,
                    ap: isAP
                });
                return;
            }
        }
        
        const calcFallback = calculateRating(14.0, record.achieve, isAP);
        unregisteredSongs.push({
            title: record.title,
            type: record.type,
            difficulty: record.difficulty,
            achieve: record.achieve,
            rank: calcFallback.rank,
            ap: isAP
        });
    });

    processedSongs.sort((a, b) => b.rating - a.rating);
    const newSongs = processedSongs.filter(s => s.isNew).slice(0, 15);
    const oldSongs = processedSongs.filter(s => !s.isNew).slice(0, 35);

    let finalSum = 0;
    newSongs.forEach(s => finalSum += s.rating);
    oldSongs.forEach(s => finalSum += s.rating);
    
    document.getElementById('loading-text').style.display = 'none';
    document.getElementById('main-content').style.display = 'block';
    document.getElementById('total-rating').innerText = finalSum;

    renderSongs(newSongs, 'new-songs-list');
    renderSongs(oldSongs, 'old-songs-list');
    renderSongs(unregisteredSongs, 'unregistered-songs-list');
}

function showError(msg) {
    document.getElementById('loading-text').style.display = 'none';
    document.getElementById('error-log').style.display = 'block';
    document.getElementById('error-message').innerText = msg;
}

function renderSongs(songs, targetId) {
    const container = document.getElementById(targetId);
    if (!container) return;
    
    songs.forEach(song => {
        const card = document.createElement('div');
        card.className = `song-card ${song.ap ? 'ap-border' : ''}`;
        let apBadge = song.ap ? `<div class="ap-badge">ALL PERFECT</div>` : '';
        let typeClass = song.type === 'DX' ? 'type-dx' : 'type-std';
        let diffClass = song.difficulty === 'Re:Master' ? 'diff-remaster' : (song.difficulty === 'Master' ? 'diff-master' : 'diff-expert');
        
        card.innerHTML = `
            ${apBadge}
            <div class="title" title="${song.title}">
                <span class="type-badge ${typeClass}">${song.type}</span>${song.title}
            </div>
            <div class="achieve">${song.achieve.toFixed(4)}%</div>
            <div class="rating">Rating: <strong>${song.rating !== undefined ? song.rating : '미등록'}</strong></div>
            <div class="diff-badge ${diffClass}">${song.difficulty}</div>
        `;
        container.appendChild(card);
    });
}
window.onload = init;
</script>
</body>
</html>
