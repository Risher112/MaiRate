<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub 데이터 분석 리포트</title>
    <!-- 따로 설치 없이 웹에서 차트 라이브러리를 바로 불러옵니다 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { 
            background-color: #121212; 
            color: #ffffff; 
            font-family: 'Arial', sans-serif; 
            padding: 20px; 
            max-width: 1000px;
            margin: 0 auto;
        }
        h1, h2 { text-align: center; color: #00ffcc; }
        .info-container {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            border: 1px solid #333;
        }
        .chart-box {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            border: 1px solid #333;
            max-height: 450px;
            display: flex;
            justify-content: center;
        }
        .grid-container { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); 
            gap: 15px; 
            margin-bottom: 40px; 
        }
        .repo-card { 
            background-color: #1e1e1e; 
            border: 2px solid #333; 
            border-radius: 10px; 
            padding: 15px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); 
        }
        .title { font-size: 16px; font-weight: bold; color: #00ffcc; margin-bottom: 5px; }
        .stars { color: #ffcc00; font-weight: bold; font-size: 14px; }
        .lang { color: #aaaaaa; font-size: 13px; margin-top: 5px; }
    </style>
</head>
<body>

    <h1>📊 GitHub 리포지토리 분석 결과</h1>
    
    <!-- 1. 기본 유저 정보 요약 섹션 -->
    <div class="info-container">
        <h2>사용자 요약</h2>
        <p>📂 <strong>총 리포지토리 수:</strong> <span id="total-repos">0</span>개</p>
        <p>⭐️ <strong>총 획득 스타(Stars) 수:</strong> <span id="total-stars">0</span>개</p>
    </div>

    <!-- 2. 시각적인 차트가 그려질 섹션 -->
    <h2>🎨 개발 언어 사용 비중 (Language Distribution)</h2>
    <div class="chart-box">
        <canvas id="languageChart"></canvas>
    </div>

    <!-- 3. 상세 리포지토리 목록 섹션 -->
    <h2>📁 리포지토리 상세 목록 (Repositories)</h2>
    <div id="repo-list" class="grid-container"></div>

<script>
// 위에서 제공된 JSON 데이터를 JavaScript 변수에 그대로 담았습니다.
const githubData = {
    "total_repositories": 12,
    "total_stars": 45,
    "language_distribution": {
        "TypeScript": 45.2,
        "Java": 25.1,
        "JavaScript": 15.3,
        "Python": 9.4,
        "HTML/CSS": 5.0
    },
    "repositories": [
        { "name": "project-alpha", "stars": 18, "language": "TypeScript" },
        { "name": "backend-api", "stars": 12, "language": "Java" },
        { "name": "frontend-dashboard", "stars": 8, "language": "TypeScript" },
        { "name": "data-analysis-tool", "stars": 5, "language": "Python" },
        { "name": "portfolio-site", "stars": 2, "language": "HTML/CSS" }
    ]
};

function init() {
    // 1. 텍스트 정보 매핑
    document.getElementById('total-repos').innerText = githubData.total_repositories;
    document.getElementById('total-stars').innerText = githubData.total_stars;

    // 2. 리포지토리 카드 목록 그리기
    const repoListContainer = document.getElementById('repo-list');
    githubData.repositories.forEach(repo => {
        const card = document.createElement('div');
        card.className = 'repo-card';
        card.innerHTML = `
            <div class="title">${repo.name}</div>
            <div class="stars">⭐️ Stars: ${repo.stars}</div>
            <div class="lang">🛠 주 언어: ${repo.language}</div>
        `;
        repoListContainer.appendChild(card);
    });

    // 3. Chart.js를 이용한 파이(Pie) 차트 그리기
    const ctx = document.getElementById('languageChart').getContext('2d');
    
    // JSON 데이터에서 차트에 쓸 라벨(언어이름)과 데이터(수치) 분리 추출
    const languages = Object.keys(githubData.language_distribution);
    const percentages = Object.values(githubData.language_distribution);

    new Chart(ctx, {
        type: 'pie', // 차트 형태 (pie: 파이 차트, bar: 막대 차트 등)
        data: {
            labels: languages,
            datasets: [{
                data: percentages,
                backgroundColor: [
                    '#3178c6', // TypeScript (파랑)
                    '#b07219', // Java (갈색)
                    '#f1e05a', // JavaScript (노랑)
                    '#3572A5', // Python (연파랑)
                    '#e34c26'  // HTML/CSS (주황)
                ],
                borderWidth: 1,
                borderColor: '#1e1e1e'
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    position: 'bottom',
                    labels: {
                        color: '#ffffff' // 범례 글자 색상 흰색으로 설정
                    }
                }
            }
        }
    });
}

// 웹페이지 로드가 완료되면 분석 실행
window.onload = init;
</script>

</body>
</html>
